name: R2 Retention Guard

on:
  workflow_run:
    workflows: ["Build and Publish Launchers"]
    types: [completed]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aht-r2-retention
  cancel-in-progress: false

jobs:
  retain:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AHT_R2_BUCKET: ${{ vars.AHT_R2_BUCKET || 'ahtlauncher' }}
      AHT_RELEASE_BASE_URL: ${{ vars.AHT_RELEASE_BASE_URL || 'https://aht-curseforge-proxy.mysticgamer312.workers.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test retention planner
        run: node scripts/test-r2-retention.mjs

      - name: Enforce manifest-aware R2 retention
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/r2-retention.mjs --apply --bucket "$AHT_R2_BUCKET" --base-url "$AHT_RELEASE_BASE_URL"

      - name: Refuse silent unprotected execution
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "Cloudflare retention credentials are not configured."
          exit 1
