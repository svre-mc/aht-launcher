name: Build and Publish Launchers

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run the non-publishing macOS Intel and Apple Silicon validation matrix"
        required: true
        type: boolean
        default: false
      publish_to_r2:
        description: "Upload the built launcher update to Cloudflare R2"
        required: true
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-macos.yml"
      - "build/**"
      - "config/**"
      - "desktop/**"
      - "pack-fixes/**"
      - "server-lock-mod/build/libs/aht-version-lock-*.jar"
      - "src/**"
      - "scripts/prepare-launcher-update.mjs"
      - "scripts/check-launcher-release-immutability.mjs"
      - "scripts/upload-r2-plan.mjs"
      - "scripts/test-github-workflow-dispatch.mjs"
      - "scripts/test-launcher-update-manifest.mjs"
      - "scripts/validate-launcher-update-manifest.mjs"
      - "package.json"
      - "package-lock.json"
      - "README.md"

permissions:
  contents: write

jobs:
  build-launcher:
    name: Build ${{ matrix.label }}
    if: github.event_name == 'push' || inputs.validation_only != true
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows
            label: Windows 10/11
            runner: windows-latest
            build_script: dist:regular:windows
            artifact_name: aht-launcher-windows
            artifact_path: |
              release-builds/windows/*.exe
              release-builds/windows/*.zip
          - id: macos
            label: macOS
            runner: macos-14
            build_script: dist:regular:macos
            artifact_name: aht-launcher-macos
            artifact_path: |
              release-builds/macos/*.dmg
              release-builds/macos/*.zip

    env:
      CSC_LINK: ${{ matrix.id == 'windows' && secrets.WINDOWS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ matrix.id == 'windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
      CSC_NAME: ${{ matrix.id == 'windows' && secrets.WINDOWS_CERTIFICATE_NAME || secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
      APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: npm run security:audit

      - name: Test platform build config
        run: npm run test:platform-builds

      - name: Test professional launch diagnostics
        run: npm run test:launch-diagnostics

      - name: Show macOS signing mode
        if: matrix.id == 'macos'
        run: |
          if [ -n "$CSC_LINK" ] || [ -n "$CSC_NAME" ]; then
            echo "macOS app signing: enabled"
          else
            echo "macOS app signing: disabled, unsigned DMGs will be produced"
          fi

          if { [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER" ]; } || { [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; } || { [ -n "$APPLE_KEYCHAIN" ] && [ -n "$APPLE_KEYCHAIN_PROFILE" ]; }; then
            echo "macOS notarization: enabled"
          else
            echo "macOS notarization: disabled"
          fi

      - name: Build ${{ matrix.label }} launcher
        run: npm run ${{ matrix.build_script }}

      - name: Verify Windows Authenticode signatures
        if: matrix.id == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'release-builds/windows' -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not produced.' }
          $installerSignature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          Write-Host "Installer signature: $($installerSignature.Status) $($installerSignature.SignerCertificate.Subject)"

          $archive = Get-ChildItem -LiteralPath 'release-builds/windows' -Filter '*.zip' -File | Select-Object -First 1
          if (-not $archive) { throw 'Windows staged update ZIP was not produced.' }
          $expanded = Join-Path $env:RUNNER_TEMP 'aht-signed-update'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded -Force
          $application = Get-ChildItem -LiteralPath $expanded -Filter 'A Hard Time Launcher Windows.exe' -File -Recurse | Select-Object -First 1
          if (-not $application) { throw 'Windows staged update does not contain the launcher executable.' }
          $applicationSignature = Get-AuthenticodeSignature -LiteralPath $application.FullName
          Write-Host "Application signature: $($applicationSignature.Status) $($applicationSignature.SignerCertificate.Subject)"

          $validSignaturePair = $installerSignature.Status -eq 'Valid' -and $applicationSignature.Status -eq 'Valid'
          $unsignedSignaturePair = $installerSignature.Status -eq 'NotSigned' -and $applicationSignature.Status -eq 'NotSigned'
          if ($validSignaturePair) {
            Write-Host 'Publishing a consistently Authenticode-signed Windows release.'
          } elseif ($unsignedSignaturePair) {
            Write-Warning 'Publishing an explicitly unsigned Windows release. SmartScreen and antivirus reputation may be reduced.'
          } else {
            throw 'Refusing to publish invalid, untrusted, or inconsistently signed Windows artifacts.'
          }

      - name: Upload ${{ matrix.label }} launcher artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  validate-macos-runtime:
    name: Validate macOS ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.validation_only == true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Apple Silicon
            runner: macos-15
            arch: arm64
            machine: arm64
            app_dir: mac-arm64
          - label: Intel
            runner: macos-15-intel
            arch: x64
            machine: x86_64
            app_dir: mac

    env:
      CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      CSC_NAME: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_DEVELOPER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEYCHAIN: ${{ secrets.APPLE_KEYCHAIN }}
      APPLE_KEYCHAIN_PROFILE: ${{ secrets.APPLE_KEYCHAIN_PROFILE }}
      AHT_ALLOW_UNENCRYPTED_DEVICE_KEY: "1"
      AHT_VERIFY_PARALLEL: "3"

    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Record runner identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "validation/${{ matrix.arch }}"
          {
            echo "runner=${{ matrix.runner }}"
            echo "expected_arch=${{ matrix.arch }}"
            echo "expected_machine=${{ matrix.machine }}"
            echo "uname_machine=$(uname -m)"
            echo "uname=$(uname -a)"
            sw_vers
            sysctl -n machdep.cpu.brand_string 2>/dev/null || true
            echo "node=$(node --version)"
          } | tee "validation/${{ matrix.arch }}/runner.txt"
          test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency security
        run: npm run security:audit

      - name: Run full source and Electron regression suite
        run: npm run verify:local
        env:
          AHT_TEST_EVIDENCE_DIR: validation/${{ matrix.arch }}

      - name: Build Intel and Apple Silicon packages
        run: npm run dist:regular:macos

      - name: Verify native package structure and player boundary
        shell: bash
        run: |
          set -euo pipefail
          APP="release-builds/macos/${{ matrix.app_dir }}/A Hard Time Launcher macOS.app"
          EXECUTABLE="$APP/Contents/MacOS/A Hard Time Launcher macOS"
          ASAR="$APP/Contents/Resources/app.asar"
          REPORT_DIR="validation/${{ matrix.arch }}"

          test -d "$APP"
          test -x "$EXECUTABLE"
          test -f "$ASAR"
          file "$EXECUTABLE" | tee "$REPORT_DIR/executable-file.txt"
          ARCHES="$(lipo -archs "$EXECUTABLE")"
          echo "architectures=$ARCHES" | tee "$REPORT_DIR/architectures.txt"
          case " $ARCHES " in
            *" ${{ matrix.arch }} "*) ;;
            *) echo "Expected ${{ matrix.arch }} in native executable architectures: $ARCHES" >&2; exit 1 ;;
          esac

          ./node_modules/.bin/asar list "$ASAR" > "$REPORT_DIR/asar-files.txt"
          if grep -Eiq '(^|/)(\.codex|cloudflare|server-lock-mod|work)(/|$)|access-control-and-data-security|wrangler\.toml|(^|/)\.env($|/)' "$REPORT_DIR/asar-files.txt"; then
            echo "Player package contains a forbidden developer, operator, or secret-bearing path." >&2
            grep -Ei '(^|/)(\.codex|cloudflare|server-lock-mod|work)(/|$)|access-control-and-data-security|wrangler\.toml|(^|/)\.env($|/)' "$REPORT_DIR/asar-files.txt" >&2
            exit 1
          fi

          shasum -a 256 "$EXECUTABLE" "$ASAR" | tee "$REPORT_DIR/native-package-sha256.txt"

      - name: Mount native DMG and copy installed app
        shell: bash
        run: |
          set -euo pipefail
          DMG="release-builds/macos/AHT-Launcher-macOS-${{ matrix.arch }}-$(node -p "require('./package.json').version").dmg"
          MOUNT_POINT="$RUNNER_TEMP/aht-dmg-${{ matrix.arch }}"
          INSTALL_ROOT="$RUNNER_TEMP/aht-installed-${{ matrix.arch }}"
          INSTALLED_APP="$INSTALL_ROOT/A Hard Time Launcher macOS.app"

          test -f "$DMG"
          rm -rf "$MOUNT_POINT" "$INSTALL_ROOT"
          mkdir -p "$MOUNT_POINT" "$INSTALL_ROOT"
          cleanup_mount() { hdiutil detach "$MOUNT_POINT" -force >/dev/null 2>&1 || true; }
          trap cleanup_mount EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          SOURCE_APP="$(find "$MOUNT_POINT" -maxdepth 2 -type d -name 'A Hard Time Launcher macOS.app' -print -quit)"
          test -n "$SOURCE_APP"
          /usr/bin/ditto "$SOURCE_APP" "$INSTALLED_APP"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

          test -x "$INSTALLED_APP/Contents/MacOS/A Hard Time Launcher macOS"
          lipo -archs "$INSTALLED_APP/Contents/MacOS/A Hard Time Launcher macOS" | tee "validation/${{ matrix.arch }}/installed-architectures.txt"
          shasum -a 256 "$DMG" "release-builds/macos/AHT-Launcher-macOS-${{ matrix.arch }}-$(node -p "require('./package.json').version").zip" | tee "validation/${{ matrix.arch }}/artifacts-sha256.txt"

      - name: Inspect signing, notarization, and Gatekeeper state
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          DMG="release-builds/macos/AHT-Launcher-macOS-${{ matrix.arch }}-$VERSION.dmg"
          APP="$RUNNER_TEMP/aht-installed-${{ matrix.arch }}/A Hard Time Launcher macOS.app"
          REPORT="validation/${{ matrix.arch }}/apple-trust.txt"

          set +e
          codesign --verify --deep --strict --verbose=4 "$APP" > "$REPORT" 2>&1
          CODESIGN_STATUS=$?
          codesign -d --verbose=4 "$APP" >> "$REPORT" 2>&1
          spctl --assess --type execute --verbose=4 "$APP" >> "$REPORT" 2>&1
          GATEKEEPER_STATUS=$?
          xcrun stapler validate "$DMG" >> "$REPORT" 2>&1
          STAPLER_STATUS=$?
          set -e

          {
            echo "codesign_status=$CODESIGN_STATUS"
            echo "gatekeeper_status=$GATEKEEPER_STATUS"
            echo "stapler_status=$STAPLER_STATUS"
          } | tee -a "$REPORT"

          SIGNING_CONFIGURED=false
          if [ -n "${CSC_LINK:-}" ] || [ -n "${CSC_NAME:-}" ]; then SIGNING_CONFIGURED=true; fi
          NOTARIZATION_CONFIGURED=false
          if { [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; } || { [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; } || { [ -n "${APPLE_KEYCHAIN:-}" ] && [ -n "${APPLE_KEYCHAIN_PROFILE:-}" ]; }; then NOTARIZATION_CONFIGURED=true; fi

          echo "signing_configured=$SIGNING_CONFIGURED" | tee -a "$REPORT"
          echo "notarization_configured=$NOTARIZATION_CONFIGURED" | tee -a "$REPORT"
          if [ "$SIGNING_CONFIGURED" = true ] && [ "$CODESIGN_STATUS" -ne 0 ]; then
            echo "Signing credentials were configured, but strict code-signature verification failed." >&2
            exit 1
          fi
          if [ "$NOTARIZATION_CONFIGURED" = true ] && [ "$STAPLER_STATUS" -ne 0 ]; then
            echo "Notarization credentials were configured, but the DMG has no valid stapled ticket." >&2
            exit 1
          fi
          if [ "$SIGNING_CONFIGURED" = false ]; then echo "::warning::macOS artifacts are unsigned because Apple signing credentials are not configured."; fi
          if [ "$NOTARIZATION_CONFIGURED" = false ]; then echo "::warning::macOS artifacts are not notarized because Apple notarization credentials are not configured."; fi
          if [ "$GATEKEEPER_STATUS" -ne 0 ]; then echo "::warning::Gatekeeper assessment did not accept the installed app; see apple-trust.txt."; fi

      - name: Run packaged-player interaction suite
        env:
          AHT_INSTALLED_PLAYER_EXE: ${{ runner.temp }}/aht-installed-${{ matrix.arch }}/A Hard Time Launcher macOS.app/Contents/MacOS/A Hard Time Launcher macOS
        run: npm run verify:installed-player

      - name: Recheck startup transition against packaged app
        env:
          AHT_SMOKE_EXE: ${{ runner.temp }}/aht-installed-${{ matrix.arch }}/A Hard Time Launcher macOS.app/Contents/MacOS/A Hard Time Launcher macOS
        run: npm run test:startup-transition

      - name: Upload native macOS validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aht-macos-validation-${{ matrix.arch }}
          path: |
            validation/${{ matrix.arch }}/**
            release-builds/macos/AHT-Launcher-macOS-${{ matrix.arch }}-*.dmg
            release-builds/macos/AHT-Launcher-macOS-${{ matrix.arch }}-*.zip
          if-no-files-found: warn

  publish-launcher-update:
    name: Publish Launcher Update
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    needs: build-launcher
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.validation_only != true
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AHT_R2_BUCKET: ${{ vars.AHT_R2_BUCKET || 'ahtlauncher' }}
      AHT_RELEASE_BASE_URL: ${{ vars.AHT_RELEASE_BASE_URL || 'https://aht-curseforge-proxy.mysticgamer312.workers.dev' }}
      AHT_LAUNCHER_UPDATE_URL: ${{ vars.AHT_LAUNCHER_UPDATE_URL || 'https://aht-curseforge-proxy.mysticgamer312.workers.dev/launcher/latest.json' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test launcher update manifest
        run: npm run test:launcher-update-manifest

      - name: Download launcher artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: aht-launcher-*
          merge-multiple: true
          path: ci-artifacts

      - name: Resolve launcher version
        id: launcher
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=launcher-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare launcher update manifest
        run: node scripts/prepare-launcher-update.mjs --artifacts ci-artifacts --out ci-launcher-update --latest-url "$AHT_LAUNCHER_UPDATE_URL"

      - name: Validate generated launcher update manifest
        run: node scripts/validate-launcher-update-manifest.mjs ci-launcher-update/launcher/latest.json --latest-url "$AHT_LAUNCHER_UPDATE_URL"

      - name: Enforce immutable launcher versions
        run: node scripts/check-launcher-release-immutability.mjs --candidate ci-launcher-update/launcher/latest.json --latest-url "$AHT_LAUNCHER_UPDATE_URL"

      - name: Create or update GitHub Release
        run: |
          set -euo pipefail
          TAG="${{ steps.launcher.outputs.tag }}"
          VERSION="${{ steps.launcher.outputs.version }}"
          TITLE="AHT Launcher $VERSION"
          NOTES_FILE="ci-launcher-update/release-notes.md"
          cp ci-launcher-update/launcher/latest.json ci-launcher-update/launcher-latest.json
          {
            echo "Automated AHT Launcher release $VERSION."
            echo
            echo "Includes Windows 10/11, macOS Apple Silicon, and macOS Intel builds."
            echo
            echo "Launcher update feed: $AHT_LAUNCHER_UPDATE_URL"
            echo "Source commit: $GITHUB_SHA"
          } > "$NOTES_FILE"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Published launcher versions are immutable; bump package.json." >&2
            exit 1
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes-file "$NOTES_FILE" --latest

          shopt -s nullglob
          release_assets=(ci-artifacts/*.exe ci-artifacts/*.dmg ci-launcher-update/launcher-latest.json)
          if [ "${#release_assets[@]}" -eq 0 ]; then
            echo "No public release assets found."
            exit 1
          fi
          echo "Public GitHub release assets:"
          printf ' - %s\n' "${release_assets[@]}"
          echo "Windows and macOS ZIP artifacts are kept in the R2 launcher update feed for in-app updates only."

          for asset in "${release_assets[@]}"; do
            name="$(basename "$asset")"
            for attempt in 1 2 3; do
              if gh release upload "$TAG" "$asset" --repo "$GITHUB_REPOSITORY"; then
                break
              fi
              if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq ".assets[].name" | grep -Fxq "$name"; then
                echo "Asset $name is present after upload warning; continuing."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep $((attempt * 10))
            done
          done

      - name: Upload launcher update plan
        uses: actions/upload-artifact@v4
        with:
          name: aht-launcher-update-plan
          path: ci-launcher-update/**
          if-no-files-found: error

      - name: Skip R2 publish when Cloudflare secrets are missing
        if: (github.event_name == 'push' || inputs.publish_to_r2 == true) && (env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '')
        run: |
          echo "::notice::Cloudflare R2 publish skipped because CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing."
          echo "::notice::Build artifacts and a launcher update plan were still created."

      - name: Skip R2 publish by manual request
        if: github.event_name == 'workflow_dispatch' && inputs.publish_to_r2 != true
        run: echo "::notice::Cloudflare R2 publish skipped because publish_to_r2=false."

      - name: Publish launcher update to R2
        if: (github.event_name == 'push' || inputs.publish_to_r2 == true) && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/upload-r2-plan.mjs --plan ci-launcher-update/upload-plan.json --bucket "$AHT_R2_BUCKET"

      - name: Enforce manifest-aware R2 retention
        if: (github.event_name == 'push' || inputs.publish_to_r2 == true) && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: node scripts/r2-retention.mjs --apply --bucket "$AHT_R2_BUCKET" --base-url "$AHT_RELEASE_BASE_URL"
